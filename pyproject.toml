[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agnara-task-intelligence"
version = "0.1.0"
description = "Historical reference application built with Agnara."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Blandskron" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "agnara==0.1.0a2",
]

[project.urls]
Homepage = "https://github.com/agnara-project/agnara-task-intelligence"
Repository = "https://github.com/agnara-project/agnara-task-intelligence"
Issues = "https://github.com/agnara-project/agnara-task-intelligence/issues"
Agnara = "https://github.com/Blandskron/agnara"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
