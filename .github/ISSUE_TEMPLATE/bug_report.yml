name: Bug Report
description: Create a report to help us improve the reference application
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please note this repository is a historical reference application for Agnara.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, etc.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you using? (must be >= 3.14)
    validations:
      required: true
  - type: input
    id: agnara-version
    attributes:
      label: Agnara Version
      description: What version of Agnara is installed? (Expected: 0.1.0a2)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Please paste any relevant logs or outputs.
